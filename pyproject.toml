[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-preparation-engine"
version = "0.1.0"
description = "Local, traceable preparation of customer defect data for STAR input."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Sakura Software Solutions"}]
dependencies = [
    "fastapi>=0.117.1",
]

[project.scripts]
star-prep = "star_preparation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "star_preparation.cloud_app:app"
