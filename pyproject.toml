[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "star-preparation-engine"
version = "0.2.0"
description = "Guided, traceable customer defect preparation and internal team dashboard for STAR."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Sakura Software Solutions"}]
dependencies = [
    "fastapi>=0.117.1",
]

[project.scripts]
star-prep = "star_preparation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
star_preparation = ["web_assets/*.html", "web_assets/*.css", "web_assets/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "star_preparation.cloud_app:app"
